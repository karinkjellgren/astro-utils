[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "astro-utils"
version = "0.1.0"
description = "Useful Python functions for my work"
readme = "README.md"
requires-python = ">=3.9"

dependencies = [
    "numpy",
    "matplotlib",
    "h5py",
]

[tool.setuptools.packages.find]
where = ["src"]
